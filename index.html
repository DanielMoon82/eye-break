<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>1분 눈운동</title>
  <meta name="description" content="점을 따라 눈을 움직이는 1분 눈 스트레칭. 좌우·상하·원·8자·초점·깜빡임 6가지 동작을 10초씩.">
  <meta name="theme-color" content="#1d1b3a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 배경: 해 질 녘 호수 — 그라데이션 하늘, 떠다니는 빛 입자, 잔물결 -->
  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="motes"></div>
    <svg class="hills" viewBox="0 0 400 120" preserveAspectRatio="none">
      <path d="M0 70 C60 40 120 60 180 50 S300 20 400 55 V120 H0Z" fill="var(--hill-far)"/>
      <path d="M0 95 C80 70 150 90 230 80 S340 65 400 85 V120 H0Z" fill="var(--hill-near)"/>
    </svg>
  </div>

  <!-- 인트로: 감긴 눈이 천천히 떠지며 눈동자 속에 해가 떠오른다 -->
  <section id="intro" class="screen active" aria-label="인트로">
    <svg class="intro-eye" viewBox="0 0 200 120" aria-hidden="true">
      <defs>
        <clipPath id="lid"><path id="lidPath" d="M10 60 Q100 60 190 60 Q100 60 10 60Z"/></clipPath>
        <radialGradient id="iris" cx="50%" cy="45%" r="55%">
          <stop offset="0" stop-color="#ffe7a8"/>
          <stop offset=".45" stop-color="#ff9e6d"/>
          <stop offset="1" stop-color="#7a4fd1"/>
        </radialGradient>
      </defs>
      <g clip-path="url(#lid)">
        <rect x="0" y="0" width="200" height="120" fill="#fff8ee"/>
        <circle class="intro-iris" cx="100" cy="60" r="34" fill="url(#iris)"/>
        <circle cx="100" cy="60" r="13" fill="#2a1f4d"/>
        <circle cx="110" cy="50" r="5" fill="#fff"/>
      </g>
      <path id="lidLine" d="M10 60 Q100 60 190 60" fill="none" stroke="#fff8ee" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1 class="intro-title">1분 <b>눈운동</b></h1>
    <p class="intro-sub">잠깐, 화면에서 눈을 떼 볼까요</p>
    <button class="ghost intro-skip" id="introSkip">시작하기</button>
  </section>

  <!-- 홈 -->
  <section id="home" class="screen" aria-label="홈">
    <header class="top">
      <span class="brand">1분 눈운동</span>
      <button class="icon-btn" id="settingsBtn" aria-label="설정">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-2.5.1-1-.1-1 2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11l-.1 1 .1 1-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.2-1.9Z"/></svg>
      </button>
    </header>

    <div class="hero">
      <p class="greet" id="greet">오늘도 수고한 눈에게</p>
      <button class="start-orb" id="startBtn" aria-label="1분 눈운동 시작">
        <span class="orb-ring"></span>
        <span class="orb-core">
          <span class="orb-play">▶</span>
          <span class="orb-label">60초 시작</span>
        </span>
      </button>
    </div>

    <div class="stats">
      <div class="stat"><b id="statToday">0</b><span>오늘</span></div>
      <div class="stat"><b id="statStreak">0</b><span>연속 일수</span></div>
      <div class="stat"><b id="statTotal">0</b><span>누적 횟수</span></div>
    </div>

    <ol class="plan" id="planList"></ol>

    <p class="foot">
      눈에 통증이나 시야 이상이 있으면 운동을 멈추고 안과 진료를 받으세요.<br>
      <a href="privacy.html">개인정보처리방침</a>
    </p>
  </section>

  <!-- 운동 -->
  <section id="workout" class="screen" aria-label="운동">
    <header class="top">
      <button class="icon-btn" id="quitBtn" aria-label="그만하기">✕</button>
      <div class="bar"><i id="barFill"></i></div>
      <span class="time" id="timeLeft">60</span>
    </header>

    <div class="stage" id="stage">
      <div class="track" id="track" aria-hidden="true"></div>
      <div class="dot" id="dot" aria-hidden="true"></div>
      <div class="blink-eye" id="blinkEye" aria-hidden="true">
        <svg viewBox="0 0 120 70"><path class="be-lid" d="M5 35 Q60 -5 115 35 Q60 75 5 35Z" fill="#fff8ee"/><circle cx="60" cy="35" r="16" fill="#7a4fd1"/><circle cx="60" cy="35" r="7" fill="#2a1f4d"/></svg>
      </div>
      <div class="count" id="countdown"></div>
    </div>

    <div class="cue">
      <p class="cue-step" id="cueStep">1 / 6</p>
      <h2 id="cueTitle">좌우로 보기</h2>
      <p id="cueText">고개는 그대로, 눈으로만 점을 따라가세요</p>
    </div>

    <div class="controls">
      <button class="ghost" id="pauseBtn">일시정지</button>
      <button class="ghost" id="skipBtn">다음 동작</button>
    </div>
  </section>

  <!-- 완료 -->
  <section id="done" class="screen" aria-label="완료">
    <div class="done-wrap">
      <div class="done-badge">✓</div>
      <h2>1분 완료!</h2>
      <p id="doneMsg">눈이 한결 가벼워졌을 거예요.</p>
      <div class="stats">
        <div class="stat"><b id="doneToday">0</b><span>오늘</span></div>
        <div class="stat"><b id="doneStreak">0</b><span>연속 일수</span></div>
      </div>
      <p class="tip" id="doneTip"></p>
      <button class="primary" id="againBtn">한 번 더</button>
      <button class="ghost" id="homeBtn">처음으로</button>
    </div>
  </section>

  <!-- 설정 -->
  <dialog id="settings">
    <form method="dialog">
      <h3>설정</h3>
      <label class="row"><span>음성 안내</span><input type="checkbox" id="optVoice"></label>
      <label class="row"><span>효과음</span><input type="checkbox" id="optSound"></label>
      <label class="row"><span>진동</span><input type="checkbox" id="optVibe"></label>
      <label class="row"><span>점 속도</span>
        <select id="optSpeed"><option value="0.8">느리게</option><option value="1">보통</option><option value="1.25">빠르게</option></select>
      </label>
      <button class="primary" value="close">닫기</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
